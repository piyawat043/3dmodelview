<!doctype html>
<html lang="th">
  <head>
    <title>Vacuum Example - 3D Interactive</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');

      :not(:defined) > * { display: none; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Prompt', sans-serif;
        background-color: #f8fafc;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        background-color: #f8fafc;
        --poster-color: transparent;
      }

      /* ================= จุด Hotspot บนชิ้นงาน ================= */
      .Hotspot {
        --line-w: 40px;
        --offset-y: 0px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        border: 2px solid #2563eb;
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        box-sizing: border-box;
        cursor: pointer;
        height: 15px;
        width: 15px;
        padding: 0;
        position: relative;
        transition: all 0.3s ease;
        z-index: 5;
      }

      /* แม้จุดจะอยู่หลังชิ้นงานอื่น ก็ยังให้มองเห็นได้ชัดเจนไม่หายไป */
      .Hotspot:not([data-visible]) {
        opacity: 0.85;
      }

      .Hotspot:hover, .Hotspot.active {
        background: #2563eb;
        border-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
        transform: scale(1.25);
        opacity: 1 !important;
        z-index: 20;
      }

      /* จางจุดอื่นลงเมื่อกำลังคลิกโฟกัสจุดใดจุดหนึ่ง */
      model-viewer.has-focus .Hotspot:not(.active) {
        opacity: 0.2;
      }

      /* เส้นชี้จากจุดบนชิ้นงานออกไปทางขวา */
      .Hotspot::before {
        content: "";
        position: absolute;
        left: 100%;
        top: 50%;
        width: var(--line-w);
        height: 1.5px;
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.8), rgba(148, 163, 184, 0.45));
        pointer-events: none;
        transition: all 0.35s ease;
      }

      /* ================= กล่องข้อความโปร่งใส (อยู่ทางขวาของชิ้นงาน) ================= */
      .HotspotAnnotation {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        color: #1e293b;
        display: block;
        font-family: 'Prompt', sans-serif;
        font-size: 10.5px;
        font-weight: 400;
        line-height: 1.35;
        left: calc(100% + var(--line-w));
        padding: 5px 8px;
        position: absolute;
        top: calc(50% + var(--offset-y));
        transform: translateY(-50%);
        pointer-events: none;
        width: max-content;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .HotspotAnnotation strong {
        display: block;
        color: #1d4ed8;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 1px;
        transition: font-size 0.35s ease;
      }

      /* ================= ขนาดรูปและวิดีโอ (สถานะปกติ) ================= */
      .media-row {
        display: flex;
        gap: 5px;
        margin-top: 4px;
      }

      .media-row img,
      .media-row video {
        width: 56px;
        height: 38px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        background-color: rgba(241, 245, 249, 0.5);
        display: block;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ================= ขยายขนาดเมื่อคลิกโฟกัส ================= */
      .Hotspot.active .HotspotAnnotation {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(37, 99, 235, 0.45);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
        font-size: 12.5px;
        line-height: 1.45;
        padding: 9px 11px;
        top: 50%;
      }

      .Hotspot.active .HotspotAnnotation strong {
        font-size: 14px;
        margin-bottom: 3px;
      }

      .Hotspot.active .media-row {
        gap: 6px;
        margin-top: 6px;
      }

      .Hotspot.active .media-row img,
      .Hotspot.active .media-row video {
        width: 125px;
        height: 80px;
        border-radius: 6px;
      }

      /* ================= แถบโหลดโมเดล ================= */
      .progress-bar {
        display: block;
        width: 30%;
        height: 4px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 25px;
        background-color: rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .progress-bar.hide { visibility: hidden; }
      .update-bar {
        background-color: #2563eb;
        width: 0%;
        height: 100%;
        transition: width 0.3s;
      }

      /* ปุ่ม AR มุมซ้ายล่าง */
      #ar-button {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(4px);
        position: absolute;
        bottom: 14px;
        left: 14px;
        padding: 5px 10px;
        font-family: 'Prompt', sans-serif;
        font-size: 11px;
        color: #334155;
        border-radius: 10px;
        border: 1px solid rgba(203, 213, 225, 0.7);
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .Hotspot::before { width: calc(var(--line-w) * 0.45); }
        .HotspotAnnotation { left: calc(100% + (var(--line-w) * 0.45)); }
        .Hotspot.active .media-row img,
        .Hotspot.active .media-row video { width: 95px; height: 62px; }
      }
    </style>
  </head>
  <body>

    <!-- ตั้ง camera-target เริ่มต้นให้ชิ้นงานเยื้องซ้ายเล็กน้อย เปิดพื้นที่ด้านขวา -->
    <model-viewer 
      id="vacuum-viewer"
      src="https://piyawat043.github.io/3dmodelview/vacuum_ex.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y"
      tone-mapping="neutral" 
      shadow-intensity="1.5" 
      exposure="1.28" 
      shadow-softness="1" 
      environment-image="legacy"
      camera-target="0.14m -0.03m -0.42m"
      camera-orbit="3.778deg 74.8deg 2.85m" 
      field-of-view="20.11deg" 
      min-camera-orbit="-25deg 5deg auto" 
      max-camera-orbit="25deg 82deg auto">

      <!-- Step 1 : 2.png และ 2.mp4 -->
      <button class="Hotspot" slot="hotspot-3" 
        style="--line-w: 145px; --offset-y: -75px;"
        data-position="-0.09975788658298201m -0.04175009352813376m -0.5848926871429172m" 
        data-normal="0.0020909524678074443m 0.9999842891292221m 0.005200904969524357m"
        data-focus-target="0.14m -0.04m -0.58m"
        data-orbit="-4deg 72deg 1.95m">
          <div class="HotspotAnnotation">
            <strong>Step 1: วางวัสดุ</strong>- วางเอียง / วัด 6 จุด
            <div class="media-row">
              <img src="2.png" alt="2" onerror="this.style.display='none'">
              <video src="2.mp4" autoplay loop muted playsinline onerror="this.style.display='none'"></video>
            </div>
          </div>
      </button>

      <!-- Step 2 : 3.png และ 3.mp4 -->
      <button class="Hotspot" slot="hotspot-4" 
        style="--line-w: 55px; --offset-y: -15px;"
        data-position="0.11037490437446362m -0.04221068658330552m -0.5808154453568689m" 
        data-normal="0.0020909524678070844m 0.999984289129222m 0.005200904969524365m"
        data-focus-target="0.24m -0.04m -0.58m"
        data-orbit="4deg 72deg 1.95m">
          <div class="HotspotAnnotation">
            <strong>Step 2: พลิกชิ้นงาน</strong>- วางเอียง / วัด 6 จุด
            <div class="media-row">
              <img src="3.png" alt="3" onerror="this.style.display='none'">
              <video src="3.mp4" autoplay loop muted playsinline onerror="this.style.display='none'"></video>
            </div>
          </div>
      </button>

      <!-- Step 3 : 4.png และ 4.mp4 -->
      <button class="Hotspot" slot="hotspot-5" 
        style="--line-w: 135px; --offset-y: 45px;"
        data-position="-0.06886423366442135m -0.01330708910611883m -0.4082119037381376m" 
        data-normal="-0.21049075738726505m -0.00464427252279961m 0.9775848156488877m"
        data-focus-target="0.15m -0.02m -0.41m"
        data-orbit="0deg 68deg 1.9m">
          <div class="HotspotAnnotation">
            <strong>Step 3: เจาะสัน</strong>- วางเอียง / วัด 6 จุด
            <div class="media-row">
              <img src="4.png" alt="4" onerror="this.style.display='none'">
              <video src="4.mp4" autoplay loop muted playsinline onerror="this.style.display='none'"></video>
            </div>
          </div>
      </button>

      <!-- ตัวอย่างสำเร็จ : 1.png และ 1.mp4 -->
      <button class="Hotspot" slot="hotspot-1" 
        style="--line-w: 40px; --offset-y: 88px;"
        data-position="0.14728438389019627m -0.04420307828119793m -0.2125742962494918m" 
        data-normal="0.0020909524678074756m 0.9999842891292221m 0.005200904969524393m"
        data-focus-target="0.26m -0.04m -0.21m"
        data-orbit="2deg 72deg 1.85m">
          <div class="HotspotAnnotation">
            <strong>ตัวอย่างสำเร็จ</strong>ชิ้นงานที่เสร็จสมบูรณ์
            <div class="media-row">
              <img src="1.png" alt="1" onerror="this.style.display='none'">
              <video src="1.mp4" autoplay loop muted playsinline onerror="this.style.display='none'"></video>
            </div>
          </div>
      </button>

      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          📱 AR
      </button>
    </model-viewer>

    <script>
      const viewer = document.getElementById('vacuum-viewer');
      const defaultTarget = "0.14m -0.03m -0.42m";
      const defaultOrbit = "3.778deg 74.8deg 2.85m";

      viewer.addEventListener('progress', (event) => {
        const progressBar = event.target.querySelector('.progress-bar');
        const updatingBar = event.target.querySelector('.update-bar');
        updatingBar.style.width = `${event.detail.totalProgress * 100}%`;
        if (event.detail.totalProgress === 1) progressBar.classList.add('hide');
        else progressBar.classList.remove('hide');
      });

      function resetView() {
        viewer.classList.remove('has-focus');
        document.querySelectorAll('.Hotspot').forEach(b => b.classList.remove('active'));
        viewer.cameraTarget = defaultTarget;
        viewer.cameraOrbit = defaultOrbit;
      }

      document.querySelectorAll('.Hotspot').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (btn.classList.contains('active')) {
            resetView();
            return;
          }

          document.querySelectorAll('.Hotspot').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          viewer.classList.add('has-focus');

          const focusTarget = btn.getAttribute('data-focus-target') || btn.getAttribute('data-position');
          const orbit = btn.getAttribute('data-orbit');
          if (focusTarget) viewer.cameraTarget = focusTarget;
          if (orbit) viewer.cameraOrbit = orbit;
        });
      });

      viewer.addEventListener('dblclick', (e) => {
        if (!e.target.closest('.Hotspot')) resetView();
      });
    </script>
  </body>
</html>
